<!DOCTYPE html>

<html>
  <head>
    <title>ESP Display</title>
    <!-- chart.js to display tempuratures in graph -->
    <script src=" https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js "></script>
    <script>
    // notify flask server when change mode button is pressed
    function changeMode() {
      fetch("/change_mode");
    }
    </script>
    <style>
    .outer {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .graph {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color:white;
      width:100%;
      max-width:1200px;
    }
    #myChart {
      height:100%;
      max-height:400px;
    }
    .mainclass {
      text-align: center;
      background-color: lightblue;
    }
    </style>
  </head>
  <body class="mainclass">
    <h1>ESP32 Display</h1>
    
    <h2 id ="replace">Tempurature: no data</h2>
    
    <div class="outer">
      <div class="graph">
        <canvas id="myChart"></canvas>
      </div>
    </div>
    
    <br>
    
    <button onclick="changeMode()">Change Mode</button>
    <p id="current_mode">no data</p>
    
    <h2>Led States</h2>
    <p>Click an LED to toggle it on or off</p>
    <canvas id="LEDs" style="width:1200px;height:600px;"></canvas>
  </body>
  
  <script>
  // function for drawing an individual LED
  function drawLED(ctx, offset, fill) {
    ctx.fillStyle = fill
    ctx.beginPath();
    ctx.ellipse(offset * 50 + 25, 25, 20, 20, 0, 0, 2 * Math.PI);
    ctx.fill();
    
    ctx.fillStyle = "rgb(0,0,0)"
    ctx.beginPath();
    ctx.ellipse(offset * 50 + 25, 25, 20, 20, 0, 0, 2 * Math.PI);
    ctx.stroke();
  }
  
  // draw all the LEDs as on or off on a canvas
  function drawLEDs(LEDs) {
    let canvas = document.getElementById("LEDs");
    if (canvas.getContext) {
      let ctx = canvas.getContext("2d");
      for (let i = 0; i < 6; i++) {
        let fill = "rgb(255,255,255)"
        if (LEDs[i] == "1") {
          if (i == 0 || i == 1) {
            fill = "rgb(0,255,0)"
          } else if (i == 2 || i == 3) {
            fill = "rgb(255,255,0)"
          } else if (i == 4 || i == 5) {
            fill = "rgb(255,0,0)"
          }
        }
        drawLED(ctx, i, fill);
      }
    }
  }
  
  // check which led was clicked and send to flask server
  function canvasClicked(event) {
    let canvas = document.getElementById("LEDs");
    let bounds = canvas.getBoundingClientRect();
    let x = event.clientX - bounds.left;
    
    let LED = parseInt(x / 200);
    fetch('change_led?change='+LED);
  }
  
  // get pretty string of current date
  function fullDate(now) {
    date = now.getDate() + "/"
           + (now.getMonth()+1)  + "/"
           + now.getFullYear() + " "
           + now.getHours() + ":"
           + now.getMinutes() + ":"
           + now.getSeconds();
    return date;
  }
  
  // get pretty string of current time
  function time(now) {
    return now.getHours() + ":"
           + now.getMinutes() + ":"
           + now.getSeconds();
  }
  
  // Display tempurature and add value to the graph
  function displayTemp(temp) {
    document.getElementById("replace").textContent = "Tempurature: " + temp;
    chart.data.labels.push(time(new Date()));
    chart.data.datasets.forEach((dataset) => {
        dataset.data.push(temp);
    });
    // maximum of 21 values in the graph
    if (chart.data.labels.length >= 21) {
      chart.data.labels.shift();
      chart.data.datasets.forEach((dataset) => {
        dataset.data.shift();
      });
    }
    chart.update("none");
  }
  
  // display the current LED pattern mode
  function displayMode(mode) {
    text = "Current Pattern Mode: ";
    if (mode == "0") {
      text += "Binary Display";
    } else if (mode == "1") {
      text += "Bouncing LED";
    } else if (mode == "2") {
      text += "Manual mode";
    }
    document.getElementById("current_mode").textContent = text;
  }
  
  // display data from ESP
  function displayData(data) {
    displayTemp(data["temp"]);
    displayMode(data["mode"]);
    drawLEDs(data["leds"]);
  }
  
  //reload ESP hardware data every second
  function reloadPage() {
    fetch('get_values')
      .then(response => response.json())
      .then(data => displayData(data))
      .catch(error => console.error('Error:', error));
    setTimeout(() => {reloadPage()}, 1000);
  }
  
  //setup graph
  const ctx = document.getElementById('myChart');
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [{
        backgroundColor:"rgba(0,0,255,1.0)",
        borderColor: "rgba(0,0,255,0.1)",
        data: []
      }]
    },
    options: {
      plugins: {
        legend: {display:false},
        title: {
          display: true,
          text: "Tempurature from " + fullDate(new Date()),
          font: {size:16}
        }
      }
    }
  });
  
  document.getElementById("LEDs").addEventListener("click", function click(event) {canvasClicked(event);});
  // display leds as all off initally
  drawLEDs("000000");
  reloadPage();
  </script>
</html>
